<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CEL-RON Condition Monitoring Application">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CEL-RON PMR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CEL-RON PMR</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #f5f7fa;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loading-container {
      text-align: center;
    }
    .logo-text {
      font-size: 28px;
      font-weight: bold;
      color: #003366;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #003366;
      border-bottom-color: transparent;
      border-radius: 50%;
      display: inline-block;
      box-sizing: border-box;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
  <script src="flutter.js" defer></script>
</head>
<body>
  <div id="loading-indicator" class="loading-container">
    <div class="logo-text">CEL-RON PMR</div>
    <div class="loader"></div>
    <div class="loading-text">Initializing Industrial Systems...</div>
  </div>

  <script>
    window.addEventListener('load', function(ev) {
      // Wait for flutter.js to be ready
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: "{{flutter_service_worker_version}}",
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
            // Hide the loader once the app is running
            setTimeout(function() {
              document.getElementById('loading-indicator').style.display = 'none';
            }, 500);
          });
        }
      });
    });
  </script>
</body>
</html>
