<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CEL-RON Preventive Maintenance Report System">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CEL-RON PMR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CEL-RON PMR</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #f5f7fa;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }
    .logo-text {
      font-size: 28px;
      font-weight: bold;
      color: #003366;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }
    .loader {
      width: 48px;
      height: 48px;
      border: 5px solid #003366;
      border-bottom-color: transparent;
      border-radius: 50%;
      animation: rotation 1s linear infinite;
    }
    @keyframes rotation {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      margin-top: 15px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <div class="logo-text">CEL-RON PMR</div>
    <div class="loader"></div>
    <div class="loading-text">Initializing Industrial Systems...</div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Fail-safe to hide loader if app takes too long or initializes silently
    window.addEventListener('flutter-first-frame', function() {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 500);
      }
    });
    
    // Backup: Hide loader after a reasonable timeout if the event doesn't fire
    setTimeout(function() {
      var loader = document.getElementById('loading-indicator');
      if (loader && loader.style.display !== 'none') {
        loader.style.opacity = '0';
        setTimeout(function() { loader.style.display = 'none'; }, 500);
      }
    }, 10000);
  </script>
</body>
</html>
